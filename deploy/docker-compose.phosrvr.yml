name: battleship

services:
  db:
    image: ${DATABASE_IMAGE:?Patched PostgreSQL image is required}
    platform: linux/arm64
    container_name: battleship-db
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    environment:
      POSTGRES_DB: battleship
      POSTGRES_USER: battleship
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL password is required}
    volumes:
      - battleship_postgres_data:/var/lib/postgresql/data
    networks: [battleship]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U battleship -d battleship]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: ${BACKEND_IMAGE:?Backend image is required}
    platform: linux/arm64
    container_name: battleship-backend
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://battleship-db:5432/battleship
      SPRING_DATASOURCE_USERNAME: battleship
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_H2_CONSOLE_ENABLED: "false"
      APP_ALLOWED_ORIGIN_PATTERNS: "http://battleship.nightly.mx,http://battleship.nightly.mx:3006,https://battleship.nightly.mx,http://54.204.174.207:3006,http://localhost:3006,http://localhost:3000,http://localhost:3001,http://localhost:3002"
      JAVA_OPTS: -XX:MaxRAMPercentage=75.0
    ports: ["127.0.0.1:3007:8080"]
    networks: [battleship]

  frontend:
    image: ${FRONTEND_IMAGE:?Frontend image is required}
    platform: linux/arm64
    container_name: battleship-frontend
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.75
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    networks: [battleship]

  nginx:
    image: ${PROXY_IMAGE:?Patched Nginx image is required}
    platform: linux/arm64
    container_name: battleship-nginx
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on: [backend, frontend]
    ports: ["127.0.0.1:3006:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [battleship]

networks:
  battleship:
    name: battleship

volumes:
  battleship_postgres_data:
    name: ${BATTLESHIP_POSTGRES_VOLUME:-battleship_postgres_data}
