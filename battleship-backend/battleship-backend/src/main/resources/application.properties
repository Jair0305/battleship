spring.application.name=battleship-backend

# Legacy duplicate project; active code lives in the top-level app folders.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=testData;encrypt=false;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
